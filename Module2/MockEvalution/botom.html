<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottom Section</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .bottom-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 40px;
        }

        .left-images {
            display: flex;
            gap: 20px;
        }

        .left-images img {
            width: 180px;
            border-radius: 10px;
        }

        .right-content {
            display: flex;
            flex-direction: column;
            max-width: 330px;
        }

        .right-content h1 {
            margin: 0;
            font-size: 26px;
        }

        .right-content p {
            margin: 10px 0 20px 0;
            font-size: 14px;
        }

        .store-buttons {
            display: flex;
            gap: 15px;
        }

        .store-buttons img {
            width: 140px;
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>

</head>
<body>

    <div class="bottom-section">

        <!-- LEFT SIDE IMAGES -->
        <div class="left-images">
        
        <img src="https://www.dominos.co.in/assets/new_app_img@2x.png" alt="Phone Screenshot" />
        </div>

        <!-- RIGHT SIDE TEXT -->
        <div class="right-content">
            <h1>Unlock Exclusive Offers</h1>
            <p>For lightning-fast ordering experience download the Domino’s app.</p>

            <div class="store-buttons">
                <img src="https://masai-course.s3.ap-south-1.amazonaws.com/editor/uploads/2022-12-21/Screenshot%202022-12-21%20at%202.47.09%20PM_558991.png" alt="Phone Screenshot" />
                <img src="https://masai-course.s3.ap-south-1.amazonaws.com/editor/uploads/2022-12-21/Screenshot%202022-12-21%20at%202.47.43%20PM_652243.png" alt="App Store Buttons" />
            </div>
        </div>

    </div>

</body>
</html>
