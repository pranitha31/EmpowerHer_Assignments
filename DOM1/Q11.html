<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Manipulation Example</title>
  <style>
    .container {
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- Heading -->
  <h1 id="mainHeading">Original Heading</h1>

  <!-- Paragraphs -->
  <p>This is paragraph one.</p>
  <p>This is paragraph two.</p>
  <p>This is paragraph three.</p>

  <!-- Container div -->
  <div class="container">
    <p>Inside the container div.</p>
  </div>
</body>
<script>
    // 1. Select the <h1> element by its id and change text
const heading = document.getElementById("mainHeading");
heading.textContent = "Welcome to the DOM World!";

// 2. Select all <p> elements and set their text color to blue
const paragraphs = document.getElementsByTagName("p");
for (let i = 0; i < paragraphs.length; i++) {
  paragraphs[i].style.color = "blue";
}

// 3. Use querySelector to select the first <div> with class 'container'
const containerDiv = document.querySelector(".container");
containerDiv.style.backgroundColor = "yellow";

</script>
</html>
