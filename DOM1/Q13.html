<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive DOM Manipulation</title>
  <style>
    #myDiv {
      width: 300px;
      height: 150px;
      border: 2px solid black;
      margin-top: 20px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2>Interactive DOM Manipulation</h2>

  <!-- Input fields -->
  <input type="text" id="colorInput" placeholder="Enter a color name">
  <input type="text" id="textInput" placeholder="Enter text content">

  <!-- Buttons -->
  <button id="bgBtn">Change Background</button>
  <button id="textBtn">Update Text</button>

  <!-- Div -->
  <div id="myDiv">This is the initial content.</div>
</body>
<script>
    // Select elements
const colorInput = document.getElementById("colorInput");
const textInput = document.getElementById("textInput");
const bgBtn = document.getElementById("bgBtn");
const textBtn = document.getElementById("textBtn");
const myDiv = document.getElementById("myDiv");

// Function to change background color
bgBtn.addEventListener("click", () => {
  const color = colorInput.value.trim();

  // Try applying the color
  myDiv.style.backgroundColor = color;

  // Check if browser accepted the color
  if (myDiv.style.backgroundColor === "") {
    alert("Invalid color name!");
  }

  // Clear input
  colorInput.value = "";
});

// Function to update text
textBtn.addEventListener("click", () => {
  const newText = textInput.value.trim();

  if (newText === "") {
    alert("Please enter some text!");
    return;
  }

  myDiv.textContent = newText;

  // Clear input
  textInput.value = "";
});

</script>
</html>
